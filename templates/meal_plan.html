<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>栄養バランス食事プランナー</title>
    <style>
      :root {
        font-family: "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #1f2933;
        background-color: #f5f7fa;
      }
      body {
        margin: 0;
        padding: 0 1.5rem 2rem;
      }
      header {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 0 1rem;
      }
      h1 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }
      main {
        display: grid;
        gap: 1.5rem;
        max-width: 960px;
        margin: 0 auto;
      }
      form {
        background: #ffffff;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      }
      fieldset {
        border: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1rem;
      }
      .field-group {
        display: grid;
        gap: 0.4rem;
      }
      label {
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      input,
      select {
        padding: 0.6rem 0.7rem;
        border-radius: 8px;
        border: 1px solid #d2d6dc;
        font-size: 1rem;
      }
      input:focus,
      select:focus {
        outline: 2px solid #2563eb33;
        border-color: #2563eb;
      }
      .form-actions {
        margin-top: 1rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button[type="submit"] {
        background-color: #2563eb;
        color: white;
      }
      button.secondary {
        background-color: transparent;
        border: 1px solid #2563eb;
        color: #2563eb;
      }
      .error-list {
        background-color: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
        border-radius: 8px;
        padding: 0.9rem 1.1rem;
        margin-bottom: 1rem;
      }
      .meal-plan {
        background: #ffffff;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .meal-card {
        border-bottom: 1px solid #e5e7eb;
        padding: 1rem 0;
      }
      .meal-card:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .meal-heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
      }
      .meal-heading h2 {
        margin: 0;
        font-size: 1.2rem;
      }
      .macros {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.6rem;
        font-size: 0.95rem;
        color: #475569;
      }
      .totals {
        margin-top: 1.25rem;
        padding-top: 1.25rem;
        border-top: 1px solid #e2e8f0;
        display: grid;
        gap: 0.5rem;
      }
      .totals h2 {
        margin: 0;
      }
      .totals ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.4rem;
      }
      footer {
        text-align: center;
        font-size: 0.85rem;
        color: #64748b;
        margin-top: 2rem;
      }
      @media (min-width: 768px) {
        fieldset {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>栄養バランス食事プランナー</h1>
      <p>
        目標カロリーとマクロ栄養素の比率を入力すると、朝・昼・夜・スナックの提案メニューを表示します。
      </p>
    </header>
    <main>
      <section>
        <form method="post">
          $errors_block
          <fieldset>
            <div class="field-group">
              <label for="calories">目標カロリー (kcal)</label>
              <input
                type="number"
                id="calories"
                name="calories"
                min="1200"
                max="3500"
                value="$calories_value"
                required
              />
            </div>
            <div class="field-group">
              <label for="diet">食事スタイル</label>
              <select id="diet" name="diet">
                <option value="balanced" $diet_balanced_selected>バランス</option>
                <option value="vegetarian" $diet_vegetarian_selected>ベジタリアン</option>
              </select>
            </div>
            <div class="field-group">
              <label for="protein_ratio">たんぱく質比率 (%)</label>
              <input
                type="number"
                step="1"
                min="0"
                max="100"
                id="protein_ratio"
                name="protein_ratio"
                value="$protein_ratio_value"
                required
              />
            </div>
            <div class="field-group">
              <label for="carb_ratio">炭水化物比率 (%)</label>
              <input
                type="number"
                step="1"
                min="0"
                max="100"
                id="carb_ratio"
                name="carb_ratio"
                value="$carb_ratio_value"
                required
              />
            </div>
            <div class="field-group">
              <label for="fat_ratio">脂質比率 (%)</label>
              <input
                type="number"
                step="1"
                min="0"
                max="100"
                id="fat_ratio"
                name="fat_ratio"
                value="$fat_ratio_value"
                required
              />
            </div>
            <div class="field-group">
              <label for="include_snack">スナック</label>
              <select id="include_snack" name="include_snack">
                <option value="yes" $snack_yes_selected>提案する</option>
                <option value="no" $snack_no_selected>なし</option>
              </select>
            </div>
          </fieldset>
          <div class="form-actions">
            <button type="submit">プランを更新</button>
            <button type="submit" name="reset" value="1" class="secondary">
              デフォルトに戻す
            </button>
          </div>
        </form>
      </section>
      $meal_plan_block
    </main>
    <footer>プランは既存レシピの組み合わせで提案されます。</footer>
  </body>
</html>
